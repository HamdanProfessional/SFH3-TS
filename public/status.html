<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Strike Force Heroes 3 - server status</title>
    <style>
      @font-face {
        font-family: "QTypeSquare-Bold";
        src: url("/fonts/QTypeSquare-Bold.ttf") format("truetype");
        font-display: swap;
      }
      @font-face {
        font-family: "QTypeSquare-Book";
        src: url("/fonts/QTypeSquare-Book.ttf") format("truetype");
        font-display: swap;
      }
      :root {
        --bg: #05080c;
        --panel: #0c141c;
        --edge: #1c3240;
        --text: #cfe3ec;
        --dim: #6f8a97;
        --cyan: #22d3ee;
        --green: #34d399;
        --amber: #fbbf24;
        --red: #f87171;
      }
      html, body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 "QTypeSquare-Book", Verdana, sans-serif;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-wrap: wrap;
        padding: 18px 24px 10px;
        border-bottom: 1px solid var(--edge);
      }
      h1 {
        margin: 0;
        font: 22px "QTypeSquare-Bold", Verdana, sans-serif;
        letter-spacing: 2px;
        color: var(--cyan);
        text-transform: uppercase;
      }
      #summary, #updated { color: var(--dim); }
      #updated { margin-left: auto; }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 14px;
        padding: 18px 24px 40px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--edge);
        border-top: 3px solid var(--dim);
        padding: 12px 14px;
      }
      .card.up { border-top-color: var(--cyan); }
      .card.down { border-top-color: var(--red); }
      .card h2 {
        margin: 0 0 2px;
        font: 16px "QTypeSquare-Bold", Verdana, sans-serif;
        letter-spacing: 1px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .sub { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
      .badge {
        font-size: 11px;
        padding: 1px 7px;
        border: 1px solid currentColor;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .ok { color: var(--green); }
      .warn { color: var(--amber); }
      .bad { color: var(--red); }
      .dim { color: var(--dim); }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 12px;
        margin: 0;
      }
      dt { color: var(--dim); }
      dd { margin: 0; font-variant-numeric: tabular-nums; }
      details { margin-top: 8px; }
      summary { cursor: pointer; color: var(--dim); }
      pre {
        margin: 6px 0 0;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font: 11px/1.35 Consolas, monospace;
        color: var(--text);
        background: #070b10;
        border: 1px solid var(--edge);
        padding: 6px;
      }
      a { color: var(--cyan); }
    </style>
  </head>
  <body>
    <header>
      <h1>Server status</h1>
      <span id="summary">loading...</span>
      <span id="updated"></span>
    </header>
    <main id="rooms"></main>
    <script src="/status.js"></script>
  </body>
</html>

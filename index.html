<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SFH3" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Strike Force Heroes 3</title>
    <link rel="preload" href="/fonts/QTypeSquare-Book.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/QTypeSquare-Bold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/QTypeSquare-BlackMajuscles.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/QTypeSquare-Light.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/QTypeSquare-Medium.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/QTypeSquare-ExtraLight.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Xoireqe.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face {
        font-family: "QTypeSquare-Book";
        src: url("/fonts/QTypeSquare-Book.ttf") format("truetype");
        font-display: block;
      }
      @font-face {
        font-family: "QTypeSquare-Bold";
        src: url("/fonts/QTypeSquare-Bold.ttf") format("truetype");
        font-display: block;
      }
      @font-face {
        font-family: "QTypeSquare-BlackMajuscles";
        src: url("/fonts/QTypeSquare-BlackMajuscles.ttf") format("truetype");
        font-display: block;
      }
      @font-face {
        font-family: "QTypeSquare-Light";
        src: url("/fonts/QTypeSquare-Light.ttf") format("truetype");
        font-display: block;
      }
      @font-face {
        font-family: "QTypeSquare-Medium";
        src: url("/fonts/QTypeSquare-Medium.ttf") format("truetype");
        font-display: block;
      }
      @font-face {
        font-family: "QTypeSquare-ExtraLight";
        src: url("/fonts/QTypeSquare-ExtraLight.ttf") format("truetype");
        font-display: block;
      }
      @font-face {
        font-family: "Xoireqe";
        src: url("/fonts/Xoireqe.ttf") format("truetype");
        font-display: block;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
        height: 100%;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
